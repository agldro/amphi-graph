<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping One Long-Long Street</title>
    <link rel="stylesheet" href="index1.css" />
</head>

<body>

<h1 class="justify">Mapping One Long-Long Street</h1>
<div id="title">
  <h1>Workshop</h1>
  <h1>11.04.2026</h1>
</div>

<div id="viewport">
  <div id="container">
    <div id="streetSVG"></div>
    <canvas id="drawCanvas"></canvas>
  </div>
</div>

<div id="scrollControls">
  <img src="SVG/left.svg" id="scrollLeft">
  <img src="SVG/right.svg" id="scrollRight">
</div>

<div id="footer">
  <p>Step I</p>
  <a href="phototool.html"><img src="SVG/next.svg" width="40"></a>
</div>

<script>
const svgObject = document.getElementById('streetSVG');
const drawCanvas = document.getElementById('drawCanvas');
const container = document.getElementById('container');
const drawCtx = drawCanvas.getContext('2d');

const viewport = document.getElementById('viewport');
const step = 200;

document.getElementById('scrollRight').onclick = () => {
  viewport.scrollBy({ left: step, behavior: "smooth" });
};

document.getElementById('scrollLeft').onclick = () => {
  viewport.scrollBy({ left: -step, behavior: "smooth" });
};

fetch("SVG/street.svg")
  .then(res => res.text())
  .then(svgText => {

    // inject SVG directly into DOM
    const wrapper = document.getElementById("streetSVG");
    wrapper.innerHTML = svgText;

    const svgEl = wrapper.querySelector("svg");

    // get REAL svg size
    const viewBox = svgEl.viewBox.baseVal;
    const svgWidth = viewBox.width;
    const svgHeight = viewBox.height;

    // set container to true svg size
    container.style.width = svgWidth + "px";
    container.style.height = svgHeight + "px";

    // set canvas to identical pixel grid
    drawCanvas.width = svgWidth;
    drawCanvas.height = svgHeight;

    // IMPORTANT: set svg size attributes (not CSS)
    svgEl.setAttribute("width", svgWidth);
    svgEl.setAttribute("height", svgHeight);
  });

// Drawing
let drawing = false;

function getPointerPos(e){
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;

  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

drawCanvas.addEventListener('pointerdown', e => {
  drawing = true;
  drawCanvas.setPointerCapture(e.pointerId);
  const pos = getPointerPos(e);
  drawCtx.beginPath();
  drawCtx.moveTo(pos.x, pos.y);
});

drawCanvas.addEventListener('pointermove', e => {
  if (!drawing) return;
  const pos = getPointerPos(e);
  drawCtx.lineTo(pos.x, pos.y);
  drawCtx.strokeStyle = "red";
  drawCtx.lineWidth = 1;
  drawCtx.lineCap = "round";
  drawCtx.stroke();
});

drawCanvas.addEventListener('pointerup', () => drawing = false);
drawCanvas.addEventListener('pointercancel', () => drawing = false);
</script>
</body>
</html>

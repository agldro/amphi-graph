<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Capture</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  padding:20px;
}

video, canvas, img{
  width:100%;
  max-width:400px;
  border:1px solid black;
  margin-top:10px;
}

button{
  padding:10px 20px;
  margin:10px;
  font-size:16px;
}
</style>

</head>

<body>

<h2>Camera Capture Demo</h2>

<button id="startCamera">Allow Camera</button>
<button id="takePhoto">Take Photo</button>

<br>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none"></canvas>
<img id="photo">

    <video src="" ></video>
    <br />
<button id='flipCamera'>Flip</button>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const photo = document.getElementById("photo");

document.getElementById("startCamera").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    video.srcObject = stream;

  } catch (err) {
    alert("Camera access denied or unavailable");
    console.error(err);
  }
};

document.getElementById("takePhoto").onclick = () => {

  const context = canvas.getContext("2d");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  context.drawImage(video, 0, 0);

  const data = canvas.toDataURL("image/png");

  photo.src = data;
};


  var front = false;
var videa = document.querySelector('video');
  document.getElementById('flipCamera').onclick = function() { front = !front; };
  var constraints = { video: { facingMode: (front? "user" : "environment"), width: 640, height: 480  } };
  navigator.mediaDevices.getUserMedia(constraints)
  .then(function(mediaStream) {
    videa.srcObject = mediaStream;
    videa.onloadedmetadata = function(e) {
    videa.play();
};
})
.catch(function(err) { console.log(err.name + ": " + err.message); })
</script>

</body>


</html>

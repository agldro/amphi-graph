<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping One Long-Long Street</title>
    <link rel="stylesheet" href="index1.css" />
</head>

<body>

  <h1 class="justify">Mapping One Long-Long Street</h1>

  <div id="title">
    <h1>Workshop</h1>
     <h1>11.04.2026</h1>
 </div>

<div id="viewport">
  <div id="container">
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
  </div>
</div>

<div id="scrollControls">
  <img src="SVG/left.svg" id="scrollLeft">
  <img src="SVG/right.svg" id="scrollRight">
</div>

  <div id="footer">
    <p>Step I</p>
    <a href="phototool.html">
      <img src="SVG/next.svg" id="next">
    </a>
 </div>

<script>
const viewport = document.getElementById('viewport');
const scrollAmount = 200; // pixels per click

document.getElementById('scrollLeft').addEventListener('click', () => {
  viewport.scrollBy({
    left: -scrollAmount,
    behavior: 'smooth'
  });
});

document.getElementById('scrollRight').addEventListener('click', () => {
  viewport.scrollBy({
    left: scrollAmount,
    behavior: 'smooth'
  });
});

const bgCanvas = document.getElementById('bgCanvas');
const drawCanvas = document.getElementById('drawCanvas');
const container = document.getElementById('container');
const bgCtx = bgCanvas.getContext('2d');
const drawCtx = drawCanvas.getContext('2d');

const img = new Image();
img.src = 'SVG/street.svg';

img.onload = () => {
  const height = 500; // fixed visible height

  // Scale image height to fit viewport, keep long width
  const scale = height / img.height;
  const width = img.width * scale;

  bgCanvas.width = width;
  bgCanvas.height = height;
  drawCanvas.width = width;
  drawCanvas.height = height;

  // Make container LONG (this enables scrolling)
  container.style.width = width + 'px';
  container.style.height = height + 'px';

  bgCtx.drawImage(img, 0, 0, width, height);
};

// Drawing logic (works while scrolling)
let drawing = false;

function getMousePos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

drawCanvas.addEventListener('mousedown', (e) => {
  drawing = true;
  const pos = getMousePos(e);
  drawCtx.beginPath();
  drawCtx.moveTo(pos.x, pos.y);
});

drawCanvas.addEventListener('mousemove', (e) => {
  if (!drawing) return;
  const pos = getMousePos(e);
  drawCtx.lineTo(pos.x, pos.y);
  drawCtx.strokeStyle = 'red';
  drawCtx.lineWidth = 2;
  drawCtx.stroke();
});

drawCanvas.addEventListener('mouseup', () => drawing = false);
drawCanvas.addEventListener('mouseleave', () => drawing = false);
</script>

</body>


</html>

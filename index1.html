<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping One Long-Long Street</title>
    <link rel="stylesheet" href="index1.css" />
</head>

<body>

  <h1 class="justify">Mapping One Long-Long Street</h1>

  <div id="title">
    <h1>Workshop</h1>
     <h1>11.04.2026</h1>
 </div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none"></canvas>
<img id="photo"><div class="wrap-box">

<button id="startCamera">Allow Camera</button>
<button id="takePhoto">Take Photo</button>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const photo = document.getElementById("photo");

document.getElementById("startCamera").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    video.srcObject = stream;

  } catch (err) {
    alert("Camera access denied or unavailable");
    console.error(err);
  }
};

document.getElementById("takePhoto").onclick = () => {

  const context = canvas.getContext("2d");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  context.drawImage(video, 0, 0);

 const data = canvas.toDataURL("image/png");

photo.src = data;

fetch("https://script.google.com/macros/s/AKfycbwyRWkuU-e0XaOVE7dbyPtBXs5_VR51jXIegJvcCJmROmQxM546AhluHd9S-zDP9PK7xQ/exec", {
  method: "POST",
  mode: "no-cors",
  body: JSON.stringify({
    image: data
  })
});
};
</script>

</body>


</html>

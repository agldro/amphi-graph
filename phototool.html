<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping One Long-Long Street</title>
    <link rel="stylesheet" href="phototool.css" />
</head>

<body>
  

<h1 class="justify">Mapping One Long-Long Street</h1>
<div id="title">
  <h1>Workshop</h1>
  <h1>04.07.2026</h1>
</div>

<video id="video" autoplay playsinline></video>

<div id="center">
<button id="startCamera">Allow Camera</button>
<button id="takePhoto">Take Photo</button>
</div>

<canvas id="canvas" style="display:none"></canvas>
<img id="photo"><div class="wrap-box">


</div>

  <div id="footer">
    <p>Step II</p>
    <a href="index1.html">
      <img src="SVG/next.svg" id="back">
    </a>
 </div>

<script>

  const rowNumber =
  sessionStorage.getItem("rowNumber");

  if (!rowNumber) {

  alert(
    "No submission found. Please complete Step I first."
  );

  window.location.href =
    "index1.html";
}

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const photo = document.getElementById("photo");

document.getElementById("startCamera").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    video.srcObject = stream;

  } catch (err) {
    alert("Camera access denied or unavailable");
    console.error(err);
  }
};

document.getElementById("takePhoto").onclick = async () => {

  const context = canvas.getContext("2d");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  context.drawImage(video, 0, 0);

 const data = canvas.toDataURL("image/png");

photo.src = data;

const response = await fetch(
  "https://script.google.com/macros/s/AKfycbyLd8nERSnmkS2Pepj2Emiy3bdA5JpNKFw5_xRG8bUc_NIPQ7xte-ynuUdIth_3HTybYw/exec",
  {
    method: "POST",
    headers: {
      "Content-Type":
        "application/json"
    },
    body: JSON.stringify({
      rowNumber: rowNumber,
      image: data
    })
  }
);

const result =
  await response.json();

if (!result.success) {

  throw new Error(
    result.error
  );
}

alert("Photo saved!");
sessionStorage.removeItem("rowNumber");
sessionStorage.removeItem("rowNumber");
};

</script>

</body>


</html>
